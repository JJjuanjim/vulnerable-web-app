# ====================================================================
# Configuración del Proyecto Políglota para SonarQube / SonarCloud
# Lenguajes: JavaScript y Python
# ====================================================================

sonar.projectKey=vulnerable-web-app
sonar.projectName=Vulnerable Web App SAST
sonar.projectVersion=2.0

# Código fuente a analizar (JavaScript y Python)
sonar.sources=.
sonar.inclusions=server.js,public/app.js,public/index.html,api_service.py
sonar.exclusions=node_modules/**,__pycache__/**

# Codificación y entornos
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=nodejs,browser
sonar.python.version=3.10,3.11,3.12,3.14
